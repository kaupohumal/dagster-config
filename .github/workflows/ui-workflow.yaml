name: UI CI/CD

on:
  push:
    branches:
      - master
    paths:
      - dagster-config-ui/**
      - .github/workflows/ui-workflow.yaml

jobs:
  build-docker:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dagster-config-ui
    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Dagster image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/dagster-config-ui:test
            ${{ secrets.DOCKERHUB_USERNAME }}/dagster-config-ui:${{ github.sha }}
            
